# Nginx cho UniMatch HCMC — một tên miền phục vụ cả frontend và API.
#   https://unimatch.tech/          -> frontend (file tĩnh đã build: frontend/dist)
#   https://unimatch.tech/api/      -> backend Express (PM2 cluster, cổng 5000)
#   https://unimatch.tech/api-docs/ -> tài liệu API (apidoc, backend phục vụ)
#
# Cài: sudo cp deploy/nginx/unimatch.conf /etc/nginx/sites-available/unimatch
#      sudo ln -s /etc/nginx/sites-available/unimatch /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d unimatch.tech -d www.unimatch.tech
#        (certbot tự thêm khối listen 443 + chứng chỉ Let's Encrypt và tự gia hạn)
#
# Thư mục code mặc định của user azureuser (Azure). deploy/setup-server.sh tự thay theo $HOME khi cài.

# Danh sách server chạy API. Thêm dòng "server <IP>:5000;" để chạy API trên nhiều máy (scale ngang).
upstream unimatch_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name unimatch.tech www.unimatch.tech;

    # ---------- Frontend (React build) ----------
    root /home/azureuser/university-finder/frontend/dist;
    index index.html;
    include /etc/nginx/snippets/unimatch-security-headers.conf;

    # SPA: đường dẫn như /truong/uit không có file thật -> trả index.html cho React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File JS/CSS có hash trong tên -> cache lâu
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/unimatch-security-headers.conf;
        try_files $uri =404;
    }

    # ---------- API + tài liệu API -> backend ----------
    location ~ ^/(api|api-docs)(/|$) {
        proxy_pass http://unimatch_api;
        proxy_hide_header X-Powered-By; # không lộ "Express" cho người ngoài
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 2m; # backend nhận JSON tối đa 1mb
    }

    # Nén phản hồi văn bản
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
