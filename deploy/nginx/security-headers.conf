# Header bảo mật cho UniMatch, dùng cho cả frontend tĩnh lẫn API đi qua proxy.
# deploy/setup-server.sh chép file này vào /etc/nginx/snippets/unimatch-security-headers.conf.
#
# Lưu ý của Nginx: location nào có add_header riêng thì KHÔNG thừa hưởng add_header của server,
# nên các location như /assets/ phải include lại file này.
# "always": gửi cả khi phản hồi lỗi (404, 500...).

# Trình duyệt chỉ dùng HTTPS cho tên miền này trong 1 năm (chống hạ cấp xuống HTTP)
add_header Strict-Transport-Security "max-age=31536000" always;
# Không đoán kiểu file: file .txt không bị chạy như JavaScript
add_header X-Content-Type-Options "nosniff" always;
# Không cho trang khác nhúng UniMatch vào iframe (chống clickjacking)
add_header X-Frame-Options "DENY" always;
# Khi bấm link sang trang khác chỉ gửi tên miền, không gửi đường dẫn đầy đủ
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Web không dùng camera, micro, vị trí -> tắt hẳn
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
