# CI: mỗi Pull Request và mỗi lần push lên develop/main đều phải qua test + lint + build.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend — test + tài liệu API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit test
        run: node --test tests/*.cjs
      - name: Build tài liệu API (apidoc)
        run: npm run docs
      - name: Lưu tài liệu API thành artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: backend/public/api-docs

  tooling:
    name: Script AI review — unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test .github/scripts/gemini-review.test.mjs

  frontend:
    name: Frontend — lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit test
        run: node --test "src/**/*.test.js"
      - name: Build
        run: npm run build
